  <g stroke="#f5f0e8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="32" y1="10" x2="12" y2="56"/>
    <line x1="32" y1="10" x2="52" y2="56"/>
    <line x1="20" y1="42" x2="44" y2="42"/>
  </g>
</svg>
