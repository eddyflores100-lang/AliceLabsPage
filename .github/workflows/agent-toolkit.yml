name: Agent toolkit tests
on:
  push:
    paths:
      - 'integrations/agent-toolkit/**'
      - '.github/workflows/agent-toolkit.yml'
  pull_request:
    paths:
      - 'integrations/agent-toolkit/**'
      - '.github/workflows/agent-toolkit.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test integrations/agent-toolkit/index.test.mjs
